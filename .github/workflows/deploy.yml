name: Deploy Frontend to EC2 (Zero-Load)

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest # Heavy build happens here, NOT on your EC2
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 1. BUILD HAPPENS ON GITHUB
      - name: Install & Build
        run: |
          npm ci
          npm approve-scripts sharp unrs-resolver || true
          npm rebuild
          NEXT_PUBLIC_API_BASE_URL=https://api.niduscareer.com/api/v1 npm run build

      # 2. SETUP SSH FOR SECURE TRANSFER
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 3. RSYNC: Send ONLY the compiled files to EC2
      - name: Sync Build to EC2
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/niduscareer/frontend/

      # 4. LIGHTWEIGHT RESTART ON EC2
      - name: Install Prod Dependencies & Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/niduscareer/frontend
            npm approve-scripts sharp unrs-resolver || true
            npm ci --omit=dev
            sudo systemctl restart nextjs
            echo "✅ Frontend deployed with zero build load on EC2!"
